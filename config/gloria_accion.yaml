title: "Gloria — Tu bienestar, nuestro equipo"
language: es
orientation: vertical
subtitles_enabled: true
output_format: "mp4"
tts_rate: "-12%"
tts_voice: "es-AR-ElenaNeural"

# background_music: "assets/music/guitarra_suave.mp3"

speech_content: |
  Gloria, para nosotros tu bienestar es lo primero. Por eso, en casa hemos armado un equipo de trabajo
  muy ordenado. Queremos registrar datos muy sencillos de tu día a día, como cómo dormiste o cómo te sentís,
  para tener una fotografía perfecta de tu salud.

  Con esos datos limpios y organizados, nuestro médico validador en casa se encargará de hablar directamente,
  de colega a colega, con los mejores especialistas del mundo. Así, tu caso se presenta con el máximo rigor
  científico, sin que vos tengas que desgastarte explicando nada.

  Esta información viaja directo a los comités científicos de los centros médicos más avanzados.
  No les pedimos un favor; les presentamos un caso de estudio único y valioso para sus investigaciones,
  lo que despierta su verdadero interés científico.

  Cuando estos centros respondan, vamos a analizar con lupa cada una de sus propuestas.
  Revisaremos qué estudios piden, si sugieren telemedicina desde casa o qué condiciones ponen.
  Nosotros filtramos todo primero.

  El objetivo de este plan es que no gastemos energía, tiempo ni recursos de forma innecesaria.
  No tomaremos ninguna decisión apresurada ni planificaremos viajes extenuantes.
  Todo se evalúa primero a la distancia para proteger tu paz.

  En unos días, cuando la plataforma esté lista, te invitaremos a empezar este registro diario tan simple.
  Todo está pensado para cuidarte, blindar tu salud y avanzar con paso firme y seguro. Estamos con vos.

