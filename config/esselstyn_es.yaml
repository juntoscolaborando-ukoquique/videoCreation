speech_content: |
  La enfermedad coronaria es la principal causa de muerte en el mundo occidental.
  Pero el Dr. Caldwell Esselstyn, cirujano y director del programa cardiovascular
  de la Clínica Cleveland, tiene una afirmación contundente:
  esta enfermedad nunca debería existir.

  La medicina moderna se convirtió en una industria multimillonaria
  que trata los síntomas con fármacos, stents y cirugías de bypass.
  Estos procedimientos alivian temporalmente el dolor,
  pero no curan nada, porque no atacan la causa real: la alimentación.

  Los datos históricos son reveladores.
  En la China rural, en Papúa Nueva Guinea, en Okinawa y entre los indígenas Tarahumara de México,
  las enfermedades cardiovasculares son prácticamente inexistentes.
  El nexo común en todas estas culturas es una dieta basada en plantas,
  baja en grasas y sin aceites refinados.

  El secreto está en el endotelio: la capa interna de las arterias.
  Esta delgada película de células es la chaqueta salvavidas de todo el sistema cardiovascular.
  Cuando está sana, produce óxido nítrico, un gas vital que mantiene la sangre fluyendo suavemente,
  dilata los vasos sanguíneos y previene la formación de placa.

  Pero cada vez que consumimos grasas saturadas, productos de origen animal o aceites refinados,
  producimos una lesión inmediata en el endotelio.
  La capacidad de producir óxido nítrico cae en picada.
  La sangre se vuelve pegajosa, el colesterol LDL penetra la pared arterial,
  se oxida y forma las placas que eventualmente se rompen y causan infartos.

  El Dr. Esselstyn demostró esto con pacientes reales.
  Personas con enfermedad cardíaca terminal, a quienes la medicina convencional ya había desahuciado.
  Las angiografías antes y después son impactantes:
  arterias gravemente obstruidas volvieron a abrirse, lisas y saludables,
  tras meses de adherencia estricta a una dieta basada en plantas.
  La angina de pecho desapareció en la gran mayoría en cuestión de semanas.

  El programa es claro en lo que prohíbe.
  Nada de carne: ni roja, ni cerdo, ni pollo, ni pavo, ni pescado.
  Nada de lácteos: ni leche, ni queso, ni yogur, ni mantequilla, ni siquiera desnatados.
  Nada de huevos, ni yemas ni claras.

  Y el punto más controvertido: ningún tipo de aceite.
  Ni aceite de oliva, ni de coco, ni de girasol.
  El aceite es grasa líquida pura al cien por cien,
  y lesiona directamente las células endoteliales en el momento en que se consume.

  Para quienes ya tienen enfermedad activa, también se eliminan los frutos secos y el aguacate
  por su alto contenido graso, hasta que el endotelio se haya recuperado.

  Entonces, ¿qué se come? Una alimentación basada en alimentos vegetales integrales.
  Legumbres: lentejas, garbanzos, alubias, soja.
  Cereales integrales: avena, arroz integral, quinoa, pan y pastas cien por cien integrales sin aceite.
  Frutas enteras, no en jugo, para conservar la fibra y evitar picos de azúcar.
  Y verduras de todo tipo, con especial énfasis en las de hoja verde oscura:
  espinacas, kale, brócoli, acelgas, rúcula.

  Esselstyn recomienda masticar estas verduras al vapor varias veces al día,
  rociadas con un poco de vinagre balsámico.
  El vinagre estimula las enzimas de la boca y reactiva de inmediato
  la producción de óxido nítrico en las arterias.

  El mensaje final del doctor es de empoderamiento total.
  Decirle a un paciente que "modere" su dieta es una receta para el fracaso continuo.
  La moderación solo ralentiza la progresión de la enfermedad, no la detiene ni la revierte.

  Los pacientes no son víctimas indefensas de sus genes ni del envejecimiento.
  El destino de su salud cardiovascular está, literalmente, en la punta de sus tenedores.

