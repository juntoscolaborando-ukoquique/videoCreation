speech_content: |
  Hola, Gloria. Queremos contarte el camino claro y seguro que hemos trazado para cuidarte,
  porque cada paso está pensado para tu tranquilidad.

  Lo primero que debes saber es que la estrategia tiene una regla de oro:
  no daremos ningún paso a ciegas ni habrá gastos innecesarios.
  Todo comienza con una Fase Informacional a costo cero.

  Actualmente estamos concluyendo la Fase 1, destinada a fijar tu línea de base hemodinámica.
  Para cerrarla, solo resta procesar los últimos datos de tu monitorización domiciliaria
  y consolidar la firma digital de tu Médico Validador con su número de colegiado de Cataluña.
  Este respaldo local es el requisito indispensable para abrir la validación internacional.

  Tu dossier médico ya cuenta con un abstract técnico en inglés, que será enviado
  directamente a los portales de admisión de centros de referencia como la Mayo Clinic,
  Johns Hopkins y la Charité de Berlín.
  Esta auditoría preliminar es un protocolo estándar de la alta medicina internacional
  y no genera ningún cargo para nosotros.

  En este momento, tú no tienes que hacer nada más que descansar y dejarte cuidar.

  El factor económico solo entra en juego cuando recibamos una respuesta médica afirmativa
  y real: que el caso de Gloria califica y abren su expediente.
  Será en ese momento, y no antes, cuando se coordinará y abonará una teleconsulta
  con un especialista, con fecha acordada.
  No pagamos por una expectativa; pagamos por un acto médico concreto y pre-aprobado.

  Como verás, la estrategia conjuga el máximo rigor científico con una protección blindada
  de tu entorno. Todo el proceso está bajo control metodológico.
  Estamos procesando la complejidad para que tú solo te ocupes de recuperar tu equilibrio.
  Todo está bajo control, paso a paso, diseñado para proteger tu salud
  y darte el bienestar que te mereces.

